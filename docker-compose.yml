services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-harness:official
    container_name: deepseek-harness-dsh
    restart: unless-stopped
    # Upstream CLI reads trustedHosts ONLY from cordis.yml or --trusted-host
    # (NOT from DSH_TRUSTED_HOSTS env). Pass the LAN/public authority explicitly
    # so the /api trust fence accepts http://<LAN-IP>:3080 and http://<PUBLIC-IP>:3080.
    # Host values live in .env (gitignored) — do not hardcode IPs here.
    command: ["node", "apps/cli/lib/bin.js", "web", "--trusted-host", "${DSH_TRUSTED_HOST_LAN}", "--trusted-host", "${DSH_TRUSTED_HOST_PUBLIC}", "--trusted-host", "${DSH_TRUSTED_HOST_DOMAIN}", "--no-open"]
    environment:
      NODE_ENV: production
      # FORK: override dsh-market's bundled npm mirror (which is hardcoded to
      # mirrors.cloud.tencent.com — slow from many networks). Routes its pnpm
      # child-process installs at npmmirror (~10x faster) without rebuilding
      # the image. See FORK_CHANGES §6 (pnpm mirror selection).
      DSHM_NPM_MIRROR: "https://registry.npmmirror.com"
      # FORK: GitHub PAT for dsh-market's Gist backup (Settings → Backup → "Sync
      # through private GitHub Gist"). dsh-market/lib/gist.js reads
      # process.env.DSH_GITHUB_TOKEN; an empty value falls back to `gh auth token`
      # (unavailable inside the container) so backup will surface a token-required
      # error if unset. Keep .env out of git.
      DSH_GITHUB_TOKEN: "${DSH_GITHUB_TOKEN:-}"
      # FORK: dsh-passwords 插件的安装密钥（JWT 派生种子，fail-closed——缺省插件拒载）。
      # 值用 `openssl rand -hex 32` 生成后填进 .env；首次激活后浏览器按插件引导设置
      # 管理员密码。不上 git。
      SETUP_KEY: "${SETUP_KEY:-}"
      # FORK: 网关以明文 HTTP 跑在容器内 8080，TLS 由外层 Caddy 终止（与 Caddy→dsh:3080
      # 同一信任边界，容器网络不出宿主）。插件的自动 HTTPS（Let's Encrypt）在此拓扑
      # 不可用：宿主 80/443 被 NAS 系统占用、无 ACME 可达入口，签发失败会让密码门整体
      # 拒启（错误码 30）。PUBLIC_HOST 固定为对外域名防 Host 反射。
      MCP_GATEWAY_AUTO_TLS: "0"
      MCP_GATEWAY_PORT: "8080"
      MCP_GATEWAY_PUBLIC_HOST: "dsh.akun15623.eu.cc:3080"
    # dsh no longer publishes a host port — Caddy terminates TLS and reverse-
    # proxies into the docker network. Only the caddy container is reachable
    # from outside.
    expose:
      - "3080"
    volumes:
      # 宿主路径统一从 .env 的 HOST_APP_DATA 读取（NAS 视角根目录），
      # 迁移宿主只改 .env 一个值。docker.sock 是固定系统路径，不参数化。
      - ${HOST_APP_DATA}/deepseek-harness/_data:/root/data
      - ${HOST_APP_DATA}/deepseek-harness/.dsh:/root/.dsh
      # 以下三项由 fnOS 面板手工加入（2026-08-27），固化进 compose 防 recreate 丢失：
      # - agent-common: dsh 内 AI 读写工作区仓库
      # - SSH 私钥: 推拉 GitHub/Gitee（等于仓库写权限）
      # - docker.sock: 等于宿主 root（可起 privileged 容器/挂宿主根）。已知风险：
      #   提示注入或 dsh-passwords 插件漏洞 = NAS 沦陷；更稳替代为 socket-proxy
      #   白名单代理（按 HTTP 方法+端点过滤），如需收紧随时可换。
      - ${HOST_APP_DATA}/agent-common:/root/agent-common
      - "${HOST_APP_DATA}/agent-common/agent-common-env/ssh-key(agent-hermes):/root/.ssh"
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # 401/404 are expected postures (dsh-passwords gate active, plugin removed)
      # — only 5xx or no answer counts as unhealthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # One-shot init container: mint a self-signed cert with both trusted-host
  # IPs in the SAN, persist it to the NAS-side caddy data dir. Runs once per
  # fresh dir; subsequent restarts are no-ops.
  cert_init:
    image: alpine:3.20
    container_name: deepseek-harness-cert-init
    volumes:
      - ${HOST_APP_DATA}/deepseek-harness/caddy/data:/data
    environment:
      DSH_TRUSTED_HOST_LAN: ${DSH_TRUSTED_HOST_LAN}
      DSH_TRUSTED_HOST_PUBLIC: ${DSH_TRUSTED_HOST_PUBLIC}
      DSH_TRUSTED_HOST_DOMAIN: ${DSH_TRUSTED_HOST_DOMAIN}
    command:
      - sh
      - -c
      - |
        # Switch to a CN-mirrored Alpine repo (default dl-cdn is unreachable
        # from this network), then install openssl + mint the cert.
        sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
        apk add --no-cache openssl
        if [ ! -f /data/cert.pem ]; then
          openssl req -x509 -newkey rsa:2048 \
            -keyout /data/key.pem -out /data/cert.pem \
            -days 365 -nodes -subj "/CN=dsh" \
            -addext "subjectAltName=DNS:$$DSH_TRUSTED_HOST_DOMAIN,IP:$$DSH_TRUSTED_HOST_LAN,IP:$$DSH_TRUSTED_HOST_PUBLIC"
          echo "Self-signed cert generated (SAN: DNS:$$DSH_TRUSTED_HOST_DOMAIN,IP:$$DSH_TRUSTED_HOST_LAN,IP:$$DSH_TRUSTED_HOST_PUBLIC)"
        else
          echo "Cert already exists, skipping"
        fi
    restart: "no"

  caddy:
    image: caddy:2
    container_name: deepseek-harness-caddy
    restart: unless-stopped
    # Only the reverse proxy is reachable from outside the docker network.
    # Host port 3080 maps to container 443 (HTTPS). Users keep using port 3080
    # in their browser — only the scheme changes from http:// to https://.
    # (NAS system service holds host 80 and 443; we can't use those.)
    ports:
      - "3080:443"
    volumes:
      # Use the NAS-side absolute path because the bind-mount source lives
      # inside the agent container (LVM mount) and is invisible to the NAS
      # docker daemon. If you move this stack to a different host, change
      # this path or switch to an init-container-based config injector.
      - ${HOST_APP_DATA}/agent-common/projects/deepseek-harness/Caddyfile:/etc/caddy/Caddyfile:ro
      # NAS-side bind dirs (replaced named volumes after fnOS wiped the
      # /vol3 volume backing dirs on 2026-08-27). cert.pem/key.pem carried
      # over verbatim — same fingerprint, devices keep trusting it.
      - ${HOST_APP_DATA}/deepseek-harness/caddy/data:/data
      - ${HOST_APP_DATA}/deepseek-harness/caddy/config:/config
    depends_on:
      dsh:
        condition: service_started
      cert_init:
        condition: service_completed_successfully

# 2026-08-27: named volumes (dsh_workspace, dsh-home, caddy_data, caddy_config)
# replaced by NAS-side bind mounts — fnOS wiped their /vol3 backing dirs during
# the external-storage migration; bind dirs are visible in the NAS file manager.
